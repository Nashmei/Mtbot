name: T4Bot API checks

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/t4bot-control-api"

concurrency:
  group: t4bot-api-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m compileall -q api core storage bot main.py tests

      - name: Install control-plane test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115,<1" "pydantic-settings>=2.6" "aiosqlite>=0.20"

      - name: Run T4Bot API contract tests
        run: python -m unittest tests.test_control_api -v
